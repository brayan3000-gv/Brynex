<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>BryNex video 2</title>
<style>
@font-face{font-family:P;font-weight:500;src:url(../../fonts/Poppins-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(../../fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(../../fonts/Poppins-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#030614;font-family:P,sans-serif;font-weight:700;color:#fff}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.full{position:absolute;inset:0}
.star{position:absolute;left:0;top:0;border-radius:50%;background:#fff}
#moon{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#fff,#e0e7ff 55%,#c7d2fe);box-shadow:0 0 80px 26px rgba(199,210,254,.32)}
#sun{position:absolute;left:0;top:0;width:1600px;height:1600px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,244,214,.98) 0%,rgba(253,186,116,.75) 22%,rgba(251,113,133,.3) 50%,transparent 72%)}
#blobA,#blobB,#blobC{position:absolute;border-radius:50%;filter:blur(120px)}
#grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(147,197,253,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(147,197,253,.07) 2px,transparent 2px);background-size:120px 120px;-webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 45%,#000 20%,transparent 75%)}
#vig{background:radial-gradient(ellipse 78% 68% at 50% 48%,transparent 55%,rgba(2,4,14,.7) 100%);pointer-events:none}
#flash{opacity:0}
#cam{transform-origin:540px 960px}
.scene{position:absolute;inset:0;perspective:1800px;transform-style:preserve-3d}
.grad{background:linear-gradient(100deg,#93c5fd 0%,#3b82f6 55%,#2563eb 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.amber{background:linear-gradient(100deg,#fef3c7 0%,#fbbf24 55%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.dawn{background:linear-gradient(100deg,#fff7ed 0%,#fed7aa 45%,#fdba74 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block;white-space:pre;transform-origin:50% 70%}
.ctr{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;line-height:1}
.line{position:absolute;left:80px;white-space:nowrap;line-height:1}
.tn{font-variant-numeric:tabular-nums}
/* chat */
.bub{position:absolute;padding:26px 36px 28px;border-radius:38px;font-size:48px;font-weight:500;line-height:1.26;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.bub.in{left:80px;background:#1f2c34;border-bottom-left-radius:10px;transform-origin:0 100%}
.bub.out{right:80px;background:#1d4ed8;border-bottom-right-radius:10px;transform-origin:100% 100%}
.bub small{font-size:24px;color:#9fb0bb;margin-left:22px;font-weight:500}
.dots{display:flex;gap:14px;align-items:center;height:60px;padding:0 8px}
.dots i{width:20px;height:20px;border-radius:50%;background:#bfdbfe;display:block}
.tag{position:absolute;right:84px;height:58px;padding:0 24px;border-radius:29px;background:rgba(37,99,235,.22);border:2px solid rgba(147,197,253,.4);font-size:28px;font-weight:600;color:#bfdbfe;display:flex;align-items:center;gap:12px;white-space:nowrap;transform-origin:100% 50%}
/* teléfono */
.phone{position:absolute;left:230px;top:480px;width:620px;height:1240px;border-radius:98px;background:#0b1020;border:12px solid #25304a;box-shadow:0 70px 160px rgba(0,0,0,.7),0 0 0 3px rgba(148,163,184,.25),0 0 120px rgba(99,102,241,.35);transform-style:preserve-3d;transform-origin:50% 45%}
.phone .wall{position:absolute;inset:0;border-radius:86px;background:radial-gradient(ellipse 90% 60% at 50% 18%,#3730a3 0%,#1e1b4b 45%,#070a1c 100%);overflow:hidden}
.phone .notch{position:absolute;left:208px;top:22px;width:180px;height:44px;border-radius:22px;background:#000}
.phone .lk{position:absolute;left:0;width:596px;top:96px;text-align:center;font-size:128px;font-weight:600;line-height:1;white-space:nowrap}
.phone .lk span{font-size:40px;margin-left:12px;color:#c7d2fe}
.nt{position:absolute;left:20px;top:0;width:556px;height:128px;border-radius:36px;background:rgba(51,65,110,.92);border:2px solid rgba(199,210,254,.28);box-shadow:0 18px 40px rgba(0,0,0,.4);transform-origin:50% 50%}
.nt .ic{position:absolute;left:22px;top:24px;width:80px;height:80px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.nt b{position:absolute;left:124px;top:22px;font-size:32px;font-weight:600;white-space:nowrap}
.nt p{position:absolute;left:124px;top:68px;font-size:28px;font-weight:500;color:#cbd5e1;white-space:nowrap}
.nt em{position:absolute;right:24px;top:28px;font-size:22px;font-style:normal;font-weight:500;color:#a5b4fc}
/* mañana */
.lcard{position:absolute;left:80px;top:720px;width:920px;height:476px;border-radius:46px;background:rgba(255,255,255,.96);color:#0f172a;box-shadow:0 50px 120px rgba(30,20,60,.5);transform-origin:50% 50%}
.lcard h4{position:absolute;left:48px;top:36px;font-size:32px;font-weight:600;letter-spacing:.14em;color:#64748b;white-space:nowrap}
.lrow{position:absolute;left:28px;right:28px;height:108px;border-radius:28px;display:flex;align-items:center;padding:0 22px;gap:26px;font-size:46px;font-weight:600}
.lrow .c{position:relative;width:68px;height:68px;flex:none}
.lrow .c i,.lrow .c u{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lrow .c i{border:5px solid #cbd5e1}
.lrow .c u{background:#22c55e;box-shadow:0 0 30px rgba(34,197,94,.6)}
.lrow .p{margin-left:auto;height:52px;padding:0 22px;border-radius:26px;background:#dbeafe;color:#1d4ed8;font-size:27px;display:flex;align-items:center;white-space:nowrap}
.chip{position:absolute;left:80px;width:920px;height:116px;border-radius:58px;background:#0a1628;border:3px solid rgba(147,197,253,.4);box-shadow:0 26px 60px rgba(10,22,40,.55);display:flex;align-items:center;padding:0 26px;gap:26px;font-size:50px;white-space:nowrap;transform-origin:50% 50%}
.chip .z{width:72px;height:72px;border-radius:50%;background:linear-gradient(140deg,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;flex:none}
/* niveles */
#track{position:absolute;left:118px;top:690px;width:24px;height:790px;border-radius:12px;background:rgba(147,197,253,.16)}
#fill{position:absolute;left:0;bottom:0;width:24px;border-radius:12px;background:linear-gradient(0deg,#1d4ed8,#60a5fa 70%,#bfdbfe);box-shadow:0 0 40px rgba(59,130,246,.9)}
.node{position:absolute;left:66px;width:128px;height:128px;border-radius:50%;background:#0d2550;border:5px solid rgba(147,197,253,.35);display:flex;align-items:center;justify-content:center;font-size:66px;line-height:1;transform-origin:50% 50%}
.node u{position:absolute;inset:-5px;border-radius:50%;background:linear-gradient(140deg,#60a5fa,#1d4ed8);box-shadow:0 0 60px rgba(59,130,246,.9)}
.node span{position:relative}
.lv{position:absolute;left:236px;white-space:nowrap}
.lv b{display:block;font-size:62px;line-height:1.1}
.lv p{font-size:36px;font-weight:500;color:#bfdbfe;margin-top:10px}
/* cierre */
#wa{position:absolute;left:150px;width:780px;height:150px;border-radius:75px;background:linear-gradient(120deg,#25d366,#128c4b);display:flex;align-items:center;justify-content:center;gap:26px;font-size:45px;box-shadow:0 30px 80px rgba(37,211,102,.45)}
.ring{position:absolute;left:150px;width:780px;height:150px;border-radius:75px;border:5px solid #25d366}
</style></head><body>
<div id="stage">
  <div id="sky" class="full"></div>
  <div id="stars" class="full"></div><div id="moon"></div><div id="sun"></div>
  <div id="bg" class="full"><div id="blobA"></div><div id="blobB"></div><div id="blobC"></div><div id="grid"></div></div>
  <div id="cam" class="full"></div>
  <div id="vig" class="full"></div>
  <div id="flash" class="full"></div>
</div>
<script src="core.js"></script>
<script src="s1.js"></script>
<script src="s2.js"></script>
<script src="s3.js"></script>
<script src="s4.js"></script>
<script>window.render(0)</script>
</body></html>
