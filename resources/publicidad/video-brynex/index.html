<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>BryNex video</title>
<style>
@font-face{font-family:P;font-weight:500;src:url(../../fonts/Poppins-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(../../fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(../../fonts/Poppins-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050b17;font-family:P,sans-serif;font-weight:700;color:#fff;transform-origin:0 0}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.full{position:absolute;inset:0}
#blobA,#blobB,#blobC{position:absolute;border-radius:50%;filter:blur(120px)}
#grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(147,197,253,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(147,197,253,.07) 2px,transparent 2px);background-size:120px 120px;-webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 45%,#000 20%,transparent 75%)}
#vig{background:radial-gradient(ellipse 75% 65% at 50% 48%,transparent 55%,rgba(2,6,14,.75) 100%);pointer-events:none}
#flash{background:#dbeafe;opacity:0}
#cam{transform-origin:540px 960px}
.scene{position:absolute;inset:0;perspective:1800px;transform-style:preserve-3d}
.grad{background:linear-gradient(100deg,#93c5fd 0%,#3b82f6 55%,#2563eb 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.warm{background:linear-gradient(100deg,#fecaca 0%,#f87171 60%,#ef4444 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block;white-space:pre;transform-origin:50% 70%}
.line{position:absolute;left:80px;white-space:nowrap;line-height:1}
/* ventanas del dolor */
.win{position:absolute;width:760px;height:520px;border-radius:28px;background:#f8fafc;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.08);overflow:hidden;transform-origin:50% 50%}
.win .bar{height:74px;background:#e2e8f0;display:flex;align-items:center;padding:0 26px;gap:12px}
.win .dot{width:20px;height:20px;border-radius:50%}
.win .tab{margin-left:18px;height:48px;padding:0 24px;border-radius:14px;background:#fff;color:#0f172a;font-size:26px;font-weight:600;display:flex;align-items:center;gap:12px}
.win .chip{width:18px;height:18px;border-radius:6px}
.win .body{padding:34px 40px}
.win .ttl{color:#0f172a;font-size:38px;margin-bottom:26px}
.win .lbl{color:#64748b;font-size:22px;font-weight:600;margin-bottom:8px}
.win .inp{height:62px;border-radius:14px;border:3px solid #cbd5e1;margin-bottom:20px;display:flex;align-items:center;padding:0 20px;color:#0f172a;font-size:28px;font-weight:600}
.win .btn{height:66px;width:260px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
.toast{position:absolute;height:92px;padding:0 34px 0 26px;border-radius:24px;background:#7f1d1d;border:3px solid #ef4444;color:#fee2e2;font-size:34px;font-weight:600;display:flex;align-items:center;gap:18px;box-shadow:0 24px 60px rgba(127,29,29,.6);white-space:nowrap}
.toast i{width:44px;height:44px;border-radius:50%;background:#ef4444;color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:30px;font-weight:700}
#clock{position:absolute;left:290px;top:250px;width:500px;height:116px;border-radius:58px;background:rgba(5,11,23,.82);border:3px solid rgba(147,197,253,.35);display:flex;align-items:center;justify-content:center;gap:22px;font-size:54px;font-variant-numeric:tabular-nums;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#scrim{background:linear-gradient(180deg,transparent 48%,rgba(5,11,23,.94) 72%,#050b17 100%)}
.cap{position:absolute;left:80px;right:80px;font-size:108px;line-height:1.06}
/* tarjetas de producto */
.glass{position:absolute;border-radius:44px;background:linear-gradient(160deg,rgba(30,58,138,.55),rgba(13,37,80,.72));border:2px solid rgba(147,197,253,.28);box-shadow:0 50px 120px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.12)}
.head{position:absolute;left:80px;font-size:118px;line-height:1.04;white-space:nowrap}
.kick{position:absolute;left:84px;font-size:34px;font-weight:600;letter-spacing:.2em;color:#93c5fd;white-space:nowrap}
.row{position:absolute;left:44px;right:44px;height:112px;border-radius:26px;background:rgba(5,11,23,.5);border:2px solid rgba(147,197,253,.16);display:flex;align-items:center;padding:0 28px;gap:24px;font-size:38px;font-weight:600}
.ico{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;flex:none}
.st{margin-left:auto;font-size:30px;font-weight:600;position:relative;width:250px;height:60px}
.st>*{position:absolute;right:0;top:0;height:60px;display:flex;align-items:center;gap:14px;white-space:nowrap}
.ok{width:56px;height:56px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;box-shadow:0 0 34px rgba(34,197,94,.75)}
.spin{width:44px;height:44px;border-radius:50%;border:6px solid rgba(147,197,253,.25);border-top-color:#93c5fd}
.sk{height:22px;border-radius:11px;background:rgba(147,197,253,.22)}
.bub{position:absolute;max-width:680px;padding:26px 32px;border-radius:34px;font-size:38px;font-weight:500;line-height:1.28;transform-origin:0 100%}
.bub.in{left:44px;background:#1e293b;border-bottom-left-radius:10px}
.bub.out{right:44px;background:#2563eb;border-bottom-right-radius:10px;transform-origin:100% 100%}
.opt{position:absolute;left:80px;width:920px;height:290px;border-radius:44px;background:linear-gradient(150deg,rgba(30,58,138,.6),rgba(13,37,80,.78));border:3px solid rgba(147,197,253,.25);box-shadow:0 40px 100px rgba(0,0,0,.5);transform-origin:50% 50%}
.opt .n{position:absolute;left:44px;top:50px;width:190px;height:190px;border-radius:44px;background:linear-gradient(140deg,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;font-size:124px;line-height:1;box-shadow:0 20px 50px rgba(37,99,235,.5)}
.opt .t{position:absolute;left:276px;top:62px;font-size:58px;line-height:1.08;white-space:nowrap}
.opt .d{position:absolute;left:276px;top:166px;font-size:36px;font-weight:500;color:#bfdbfe;line-height:1.25}
.opt .glow{position:absolute;inset:-3px;border-radius:44px;border:5px solid #60a5fa;box-shadow:0 0 70px rgba(59,130,246,.75),inset 0 0 50px rgba(59,130,246,.25)}
#wa{position:absolute;left:150px;top:1180px;width:780px;height:150px;border-radius:75px;background:linear-gradient(120deg,#25d366,#128c4b);display:flex;align-items:center;justify-content:center;gap:26px;font-size:50px;box-shadow:0 30px 80px rgba(37,211,102,.45)}
.ring{position:absolute;left:150px;top:1180px;width:780px;height:150px;border-radius:75px;border:5px solid #25d366}
</style></head><body>
<div id="stage">
  <div id="bg" class="full"><div id="blobA"></div><div id="blobB"></div><div id="blobC"></div><div id="grid"></div></div>
  <div id="cam" class="full"></div>
  <div id="vig" class="full"></div>
  <div id="flash" class="full"></div>
</div>
<script src="core.js"></script>
<script src="s12.js"></script>
<script src="s3.js"></script>
<script src="s45.js"></script>
<script>window.render(0)</script>
</body></html>
