<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Capa presentadora</title>
<!--
  Capa de textos del formato «presentadora a cámara» (ver presentadora.md). La fotografía
  armar-presentadora.mjs cuadro a cuadro con fondo transparente.

  - Subtítulos palabra por palabra: cada palabra entra en SU tiempo (whisper), con rebote. La
    frase va en letra pequeña y la clave grande, en dorado, en la línea de abajo.
  - Gancho: título gigante desde el cuadro 1 (para quien ve sin sonido).
  - Tarjetas de precio y garantía (las de capa.html, más pequeñas y abajo).
  - Destellos cálidos en los cortes marcados, logo arriba y la etiqueta de IA.
  Letra: Poppins, la que eligió Brayan (12-nov-2026). Zona segura: y=270 a y=1540.
-->
<style>
@font-face{font-family:P;font-weight:500;src:url(../../../../resources/fonts/Poppins-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(../../../../resources/fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(../../../../resources/fonts/Poppins-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,sans-serif;font-weight:700;color:#fff}
.sh{text-shadow:0 0 2px rgba(0,0,0,.9),0 3px 6px rgba(0,0,0,.8),0 6px 24px rgba(0,0,0,.7)}
.grp{position:absolute;left:50px;width:980px;bottom:650px;text-align:center}
.l1{font-size:54px;font-weight:600;line-height:1.15;text-wrap:balance}
.l2{font-size:100px;line-height:1.02;letter-spacing:-.015em;text-wrap:balance;margin-top:2px}
.w{display:inline-block;white-space:pre;transform-origin:50% 75%}
.gold{text-shadow:none;background:linear-gradient(100deg,#fef3c7 0%,#fbbf24 55%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.85)) drop-shadow(0 6px 20px rgba(0,0,0,.55))}
#gancho{position:absolute;left:0;width:1080px;top:300px;text-align:center}
#gancho .a{font-size:50px;font-weight:600;font-style:italic;opacity:.95}
#gancho .t{font-size:118px;line-height:.98;letter-spacing:-.02em}
#logo{position:absolute;left:50%;top:150px;width:330px;transform:translateX(-50%);filter:brightness(1.25) drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 3px 10px rgba(0,0,0,.7))}
#tag{position:absolute;left:44px;top:290px;padding:9px 20px;border-radius:30px;background:rgba(0,0,0,.42);
  font-weight:500;font-size:25px;letter-spacing:.05em;color:rgba(255,255,255,.82)}
#flash{position:absolute;inset:0;opacity:0;
  background:radial-gradient(120% 90% at 20% 18%,rgba(255,250,225,1) 0%,rgba(255,205,110,.96) 35%,rgba(255,140,40,.9) 70%,rgba(230,90,20,.85) 100%)}
.card{position:absolute;left:110px;width:860px;border-radius:44px;background:rgba(3,6,20,.82);
  border:3px solid rgba(251,191,36,.55);box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 60px rgba(251,191,36,.18);
  text-align:center;padding:30px 40px 34px;transform-origin:50% 0%;opacity:0}
.amber{background:linear-gradient(100deg,#fef3c7 0%,#fbbf24 55%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.k1{font-size:50px;font-weight:600;line-height:1.1}
.k2{font-size:150px;line-height:1;letter-spacing:-.02em;margin:6px 0 2px}
.k3{font-size:42px;font-weight:600;color:#e2e8f0}
.g1{display:flex;align-items:center;justify-content:center;gap:18px;font-size:46px;letter-spacing:.04em}
.g2{font-size:44px;font-weight:600;line-height:1.22;margin-top:16px}
.g3{font-size:44px;line-height:1.15;margin-top:12px;white-space:nowrap}
.g4{font-size:32px;font-weight:500;color:#cbd5e1;margin-top:12px;letter-spacing:.02em}
</style></head>
<body><div id="stage">
  <img id="logo" src="../../../../resources/publicidad/video-brynex-3/brygar-letras.png">
  <div id="tag"></div>
  <div id="gancho" class="sh"></div>
  <div id="flash"></div>
</div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const pr = (t, a, d) => clamp((t - a) / d)
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
const eo3 = x => 1 - Math.pow(1 - x, 3)
const $ = id => document.getElementById(id)
const stage = $('stage')
let L = null
const grupos = []

const TARJETAS = {
  precio: d => `<div class="k1">${d.titulo ?? 'EPS sin pensión'}</div>
    <div class="k2 amber">${d.valor ?? '$125.000'}</div>
    <div class="k3">${d.pie ?? 'al mes · Todo incluido'}</div>`,
  garantia: d => `<div class="g1 amber"><svg width="54" height="62" viewBox="0 0 54 62"><path d="M27 2 L50 11 V29 C50 45 39 55 27 60 C15 55 4 45 4 29 V11 Z" fill="#fbbf24"/><path d="M16 31 l8 8 l15-17" fill="none" stroke="#030614" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>${d.titulo ?? 'GARANTÍA BRYGAR'}</div>
    <div class="g2">${d.texto ?? 'Si por tu afiliación no te dan<br>la cita o los medicamentos'}</div>
    <div class="g3 amber">${d.valor ?? 'te devolvemos el 100 % del mes'}</div>
    ${d.pie ? `<div class="g4">${d.pie}</div>` : ''}`,
}

const span = (w, gold) => `<span class="w ${gold ? 'gold' : 'sh'}">${w}</span>`

window.montar = (linea) => {
  L = linea
  for (const g of L.grupos) {
    const el = document.createElement('div'); el.className = 'grp'
    el.innerHTML = (g.small.length ? `<div class="l1">${g.small.map(x => span(x.w)).join(span(' '))}</div>` : '') +
      (g.big.length ? `<div class="l2">${g.big.map(x => span(x.w, true)).join(span(' ', true))}</div>` : '')
    stage.appendChild(el)
    const ws = [...el.querySelectorAll('.w')].filter(s => s.textContent.trim())
    grupos.push({ el, g, ws, ts: [...g.small, ...g.big].map(x => x.t) })
  }
  if (!L.logo) $('logo').remove()
  if (L.gancho?.y) $('gancho').style.top = L.gancho.y + 'px'
  if (L.gancho) $('gancho').innerHTML = `<div class="a">${L.gancho.arriba ?? ''}</div>` +
    L.gancho.titulo.map((x, i) => `<div class="t ${i === L.gancho.titulo.length - 1 ? 'gold' : ''}">${x}</div>`).join('')
  for (const c of L.tarjetas) {
    const el = document.createElement('div'); el.className = 'card'; el.innerHTML = TARJETAS[c.tipo](c)
    el.style.top = (c.y ?? 1290) + 'px'; stage.appendChild(el); c.el = el
  }
  if (L.etiqueta) $('tag').textContent = L.etiqueta.texto.toUpperCase(); else $('tag').remove()
  return Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => 0))]).then(() => true)
}

window.render = (t) => {
  const enCierre = L.cierre != null && t >= L.cierre
  // Subtítulos: el grupo se ve desde su primera palabra hasta que empieza el siguiente.
  for (const { el, g, ws, ts } of grupos) {
    const vis = !enCierre && t >= g.t0 - 0.02 && t < g.t1
    el.style.display = vis ? 'block' : 'none'; if (!vis) continue
    el.style.bottom = (g.bottom ?? 650) + 'px'
    ws.forEach((w, i) => {
      const k = pr(t, ts[i] - 0.03, 0.22)
      w.style.opacity = clamp(k * 3)
      w.style.transform = `translateY(${(1 - eo3(k)) * 18}px) scale(${0.7 + 0.3 * back(k)})`
    })
  }
  // Gancho: lleno desde el cuadro 1, con un latido suave, y sale encogiéndose.
  const gch = $('gancho')
  if (L.gancho) {
    const out = pr(t, L.gancho.t1 - 0.18, 0.18)
    gch.style.opacity = enCierre ? 0 : 1 - out
    gch.style.transform = `scale(${(1 + 0.025 * Math.sin(t * 5)) * (1 - 0.15 * out)})`
  }
  for (const c of L.tarjetas) {
    const k = pr(t, c.t0, 0.45), out = pr(t, c.t1 - 0.25, 0.25)
    c.el.style.opacity = enCierre ? 0 : clamp(k * 2) * (1 - out)
    c.el.style.transform = `scale(${(c.escala ?? 0.74) * (0.82 + 0.18 * back(k))}) translateY(${(1 - eo3(k)) * 50}px)`
  }
  if ($('logo')) $('logo').style.opacity = enCierre ? 0 : 1
  if ($('logo')) $('logo').style.transform = `translateX(-50%) scale(${0.6 + 0.4 * back(pr(t, 0.15, 0.45))})`
  const tag = $('tag'); if (tag) tag.style.opacity = enCierre ? 0 : 1
  // Destello: sube en 2 cuadros antes del corte y se apaga en ~0,3 s.
  $('flash').style.opacity = Math.max(0, ...L.destellos.map(d => t < d ? pr(t, d - 0.07, 0.07) : 1 - eo3(pr(t, d, 0.3))).map(x => x > 0 && x <= 1 ? x * 0.92 : 0))
}
</script></body></html>
