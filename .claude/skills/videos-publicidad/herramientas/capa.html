<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Capa de textos</title>
<!--
  La capa que va encima de las tomas: subtítulos, tarjetas (precio, garantía) y la etiqueta
  «Dramatización». Fondo transparente; armar.mjs la fotografía cuadro a cuadro con
  window.render(t) y la superpone con ffmpeg (el ffmpeg de la Mac no trae drawtext ni libass).

  La letra es la de los videos #114–#116, la que le gustó a Brayan (12-nov-2026): Poppins
  Bold/SemiBold, palabras que entran una a una con rebote y las clave con degradado dorado.
  Zona segura de Reels: nada importante arriba de y=270 ni debajo de y=1540.
-->
<style>
@font-face{font-family:P;font-weight:500;src:url(../../../../resources/fonts/Poppins-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(../../../../resources/fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(../../../../resources/fonts/Poppins-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,sans-serif;font-weight:700;color:#fff}
.sub{position:absolute;left:70px;width:940px;text-align:center;text-wrap:balance;font-size:68px;line-height:1.12;letter-spacing:-.01em}
.w{display:inline-block;white-space:pre;transform-origin:50% 70%;
  text-shadow:0 0 2px rgba(0,0,0,.9),0 3px 6px rgba(0,0,0,.85),0 6px 26px rgba(0,0,0,.75)}
.hl{color:#fbbf24}
.hl.grad{background:linear-gradient(100deg,#fef3c7 0%,#fbbf24 55%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.85)) drop-shadow(0 6px 22px rgba(0,0,0,.6));text-shadow:none}
#tag{position:absolute;left:44px;top:290px;padding:10px 22px;border-radius:30px;background:rgba(0,0,0,.42);
  font-weight:500;font-size:26px;letter-spacing:.06em;color:rgba(255,255,255,.82)}
.card{position:absolute;left:110px;width:860px;border-radius:44px;background:rgba(3,6,20,.80);
  border:3px solid rgba(251,191,36,.55);box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 60px rgba(251,191,36,.18);
  text-align:center;padding:34px 40px 38px;transform-origin:50% 50%;opacity:0}
.amber{background:linear-gradient(100deg,#fef3c7 0%,#fbbf24 55%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.k1{font-size:52px;font-weight:600;line-height:1.1}
.k2{font-size:150px;line-height:1;letter-spacing:-.02em;margin:8px 0 4px}
.k3{font-size:42px;font-weight:600;color:#e2e8f0}
.g1{display:flex;align-items:center;justify-content:center;gap:18px;font-size:46px;letter-spacing:.04em}
.g2{font-size:44px;font-weight:600;line-height:1.22;margin-top:18px}
.g3{font-size:44px;line-height:1.15;margin-top:14px;white-space:nowrap}
.g4{font-size:32px;font-weight:500;color:#cbd5e1;margin-top:14px;letter-spacing:.02em}
#flash{position:absolute;inset:0;background:#fff7e6;opacity:0}
</style></head>
<body><div id="stage"><div id="flash"></div><div id="tag">DRAMATIZACIÓN</div></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const pr = (t, a, d) => clamp((t - a) / d)
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
const eo3 = x => 1 - Math.pow(1 - x, 3)
const stage = document.getElementById('stage')
let L = null
const subs = []

const TARJETAS = {
  precio: d => `<div class="k1">${d.titulo ?? 'EPS sin pensión'}</div>
    <div class="k2 amber">${d.valor ?? '$125.000'}</div>
    <div class="k3">${d.pie ?? 'al mes · Todo incluido'}</div>`,
  garantia: d => `<div class="g1 amber"><svg width="54" height="62" viewBox="0 0 54 62"><path d="M27 2 L50 11 V29 C50 45 39 55 27 60 C15 55 4 45 4 29 V11 Z" fill="#fbbf24"/><path d="M16 31 l8 8 l15-17" fill="none" stroke="#030614" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>${d.titulo ?? 'GARANTÍA BRYGAR'}</div>
    <div class="g2">${d.texto ?? 'Si por tu afiliación no te dan<br>la cita o los medicamentos'}</div>
    <div class="g3 amber">${d.valor ?? 'te devolvemos el 100 % del mes'}</div>
    ${d.pie ? `<div class="g4">${d.pie}</div>` : ''}`,
}

/** Recibe la línea de tiempo que arma armar.mjs. */
window.montar = (linea) => {
  L = linea
  for (const s of L.subs) {
    const el = document.createElement('div'); el.className = 'sub'
    el.innerHTML = s.words.map(w => `<span class="w${w.hl ? ' hl grad' : ''}">${w.w}</span>`).join('<span class="w"> </span>')
    stage.appendChild(el); subs.push({ el, s, ws: [...el.querySelectorAll('.w')].filter((_, i) => i % 2 === 0) })
  }
  for (const c of L.tarjetas) {
    const el = document.createElement('div'); el.className = 'card'; el.innerHTML = TARJETAS[c.tipo](c)
    el.style.top = (c.y ?? 1080) + 'px'; stage.appendChild(el); c.el = el
  }
  if (!L.etiqueta) document.getElementById('tag').remove()
  return document.fonts.ready.then(() => true)
}

window.render = (t) => {
  for (const { el, s, ws } of subs) {
    const vis = t >= s.t0 - 0.02 && t < s.t1 + 0.14
    el.style.display = vis ? 'block' : 'none'; if (!vis) continue
    el.style.top = s.y + 'px'
    const salida = pr(t, s.t1, 0.14)
    ws.forEach((w, i) => {
      const k = pr(t, s.t0 + i * 0.07, 0.32), b = back(k)
      w.style.opacity = Math.min(k * 2.2, 1) * (1 - salida)
      w.style.transform = `translateY(${(1 - eo3(k)) * 26}px) scale(${0.72 + 0.28 * b})`
    })
  }
  for (const c of L.tarjetas) {
    const k = pr(t, c.t0, 0.5), out = pr(t, c.t1 - 0.3, 0.3)
    c.el.style.opacity = clamp(k * 2) * (1 - out)
    c.el.style.transform = `translateY(${(1 - eo3(k)) * 60 + out * 30}px) scale(${(0.8 + 0.2 * back(k)) * (1 - out * 0.06)})`
  }
  const tag = document.getElementById('tag')
  if (tag) tag.style.opacity = t < L.etiqueta?.t1 ? clamp(pr(t, 0.3, 0.4)) * (1 - pr(t, L.etiqueta.t1 - 0.3, 0.3)) : 0
  const f = document.getElementById('flash')
  f.style.opacity = Math.max(0, ...L.destellos.map(d => (t >= d && t < d + 0.5) ? 0.55 * (1 - pr(t, d, 0.5)) : 0))
}
</script></body></html>
