# Consulta, con un SELECT, las bases de producción en netcup, desde GitHub →
# Actions → Consultar datos → Run workflow. Lo usa sobre todo un hilo de
# Claude: lo lanza, baja el resultado y lo abre con su llave.
#
# **Las filas nunca quedan legibles en GitHub.** El resultado trae celulares,
# cédulas y puestos de votación, y el repo lo ven sus colaboradores. Por eso no
# se imprime en el log: sale cifrado con age para la llave pública del secret
# CONSULTAR_AGE_DESTINO —la privada no está en GitHub, solo en el entorno de
# Claude— y el artifact se borra solo al día. En el log queda solo cuántas
# filas trajo.
#
# Solo lee. La llave NETCUP_CONSULTAR_KEY no da shell: en el servidor tiene un
# command= forzado (/usr/local/sbin/consultar-gh, copia de
# scripts/consultar-gh.sh) que solo acepta el nombre de la app, y la consulta
# corre con un rol de la base que no puede escribir. Ver scripts/CONSULTAR.md.
name: Consultar datos

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Qué base"
        type: choice
        options:
          - liderapp
          - bahia
          - avappi
          - brynex
          - cuentafacil
          - megatransportes
        default: liderapp
      sql:
        description: "Un solo SELECT (sale en CSV, máximo 20.000 filas)"
        type: string
        required: true

permissions: {}

# De a uno: dos consultas a la vez se mezclarían en nada, pero así el log de
# cada corrida es solo suyo.
concurrency:
  group: consultar-datos
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preparar la llave SSH
        env:
          NETCUP_CONSULTAR_KEY: ${{ secrets.NETCUP_CONSULTAR_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NETCUP_CONSULTAR_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo '159.195.233.132 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILI9SX/CNPHG/vGvc7tKDfMlVCEeWpc4QjD3rAXDnOiz' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null

      - name: Consultar
        env:
          APP: ${{ inputs.app }}
          SQL: ${{ inputs.sql }}
          DESTINO: ${{ secrets.CONSULTAR_AGE_DESTINO }}
        run: |
          [[ "$DESTINO" == age1* ]] || { echo "Falta el secret CONSULTAR_AGE_DESTINO (llave pública age1...)."; exit 2; }
          mkdir -p resultado
          # El SQL va por la entrada estándar y nunca dentro del comando: el
          # servidor solo recibe el nombre de la app. El CSV va directo a age,
          # sin pasar en claro por el disco ni por el log.
          set -o pipefail
          printf '%s\n' "$SQL" | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -- root@159.195.233.132 "$APP" \
            | tee >(wc -l | awk '{ printf "Filas: %d (sin contar el encabezado)\n", ($1 > 0 ? $1 - 1 : 0) }' >&2) \
            | age -r "$DESTINO" -o resultado/resultado.csv.age

      - name: Guardar el resultado cifrado
        uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: resultado/resultado.csv.age
          retention-days: 1
          if-no-files-found: error

      - name: Borrar la llave
        if: always()
        run: rm -f ~/.ssh/id_ed25519
